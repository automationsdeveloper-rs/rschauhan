<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HireNest — Get the Job You Deserve. Hire the Talent You Need.</title>
    <meta name="description" content="India's smartest recruitment marketplace. Apply to open jobs, raise a custom job request, or post a hiring requirement and get verified profiles in 48 hours." />
    <meta property="og:title" content="HireNest — India's Smartest Way to Get Hired & Hire" />
    <meta property="og:description" content="Apply to open jobs in minutes. Can't find the right one? Tell us what you want — we'll find it for you." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#5B4BFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
